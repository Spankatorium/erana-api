name: Erana TST Deploy

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build docker image
        run: docker build -t erana:tst .

      - name: Save image as TAR
        run: docker save erana:tst | gzip > erana-tst.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: erana-tst
          path: erana-tst.tar.gz


  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: erana-tst
          path: /opt/erana/tst

      - name: Load image from TAR
        run: |
          cd /opt/erana/tst
          gunzip -c erana-tst.tar.gz | docker load
